  <main>
    <section>
  <form action="#" method="POST">
    <fieldset>
      <legend>Contact Me</legend>

      <p>
        <label for="name">Full Name:</label><br>
        <input
          type="text"
          id="name"
          name="name"
          required
          minlength="2"
        >
      </p>

      <p>
        <label for="email">Email Address:</label><br>
        <input
          type="email"
          id="email"
          name="email"
          required
        >
      </p>

      <p>
        <label for="phone">Phone (Optional):</label><br>
        <input
          type="tel"
          id="phone"
          name="phone"
          pattern="[0-9\-\s]{7,}"
        >
      </p>

      <p>
        <label for="message">Message:</label><br>
        <textarea
          id="message"
          name="message"
          rows="5"
          required
        ></textarea>
      </p>

      <p>
        <button type="submit">Send</button>
      </p>
    </fieldset>
  </form>
</section>
